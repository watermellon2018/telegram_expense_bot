# Конфигурация Alembic для telegram_expense_bot (feature_113).
#
# ВАЖНО: строка подключения к БД здесь НЕ хранится. URL собирается в alembic/env.py
# из тех же переменных окружения, что использует рантайм бота
# (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD) — см. utils/db.py.
# Это исключает попадание секретов в репозиторий.
#
# Проект использует сырой SQL + asyncpg (без ORM/SQLAlchemy-моделей), поэтому
# autogenerate не применяется — миграции пишутся вручную через op.execute(...).

[alembic]
# Путь к каталогу с миграциями (относительно расположения alembic.ini)
script_location = alembic

# Имена файлов ревизий: <дата>_<slug>_<rev>.py — для читаемой хронологии
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s_%%(rev)s

# Каталог(и) с версиями. По умолчанию — alembic/versions.
# version_locations = %(here)s/alembic/versions

# Часовой пояс для меток в шаблоне (UTC, как и всё в проекте)
timezone = UTC

# Максимальная длина slug в имени файла ревизии
truncate_slug_length = 40

# sqlalchemy.url намеренно не задан — устанавливается программно в env.py.
sqlalchemy.url =


# Логирование Alembic. Не выводим параметры подключения/секреты.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
