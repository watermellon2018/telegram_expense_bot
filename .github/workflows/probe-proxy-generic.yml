name: Inspect previous host boot

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - name: Inspect previous boot ending
        shell: bash
        run: |
          set +e
          echo "=== LAST REBOOTS ==="
          last -x | head -20 || true
          echo
          echo "=== PREVIOUS BOOT TAIL ==="
          journalctl -b -1 -n 180 --no-pager 2>&1 || true
          echo
          echo "=== PREVIOUS BOOT POWER/REBOOT SIGNALS ==="
          journalctl -b -1 --no-pager 2>&1 | grep -Ei 'reboot|shutdown|power|watchdog|panic|oom|out of memory|thermal|segfault|systemd-shutdown|Reached target.*Shutdown|Stopping Docker|Stopped Docker' | tail -120 || true
