name: Inspect kernel update reboot

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - name: Inspect apt and unattended-upgrades
        shell: bash
        run: |
          set +e
          echo "=== CURRENT/PREV KERNEL ==="
          uname -a || true
          last -x | head -8 || true
          echo
          echo "=== UNATTENDED UPGRADES ==="
          grep -Ei 'linux-image|linux-headers|reboot|restart|required' /var/log/unattended-upgrades/unattended-upgrades.log 2>/dev/null | tail -160 || true
          echo
          echo "=== APT HISTORY ==="
          grep -Ei -A4 -B4 'linux-image|linux-headers|linux-generic|upgrade' /var/log/apt/history.log 2>/dev/null | tail -220 || true
          echo
          echo "=== REBOOT REQUIRED ==="
          cat /var/run/reboot-required 2>/dev/null || true
          cat /var/run/reboot-required.pkgs 2>/dev/null || true
          echo
          echo "=== UNATTENDED REBOOT CONFIG ==="
          grep -RHiE 'Automatic-Reboot|Automatic-Reboot-Time' /etc/apt/apt.conf.d 2>/dev/null || true
