name: Restart money bot

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  restart:
    runs-on: self-hosted
    steps:
      - name: Restart money_bot and verify
        shell: bash
        run: |
          set -e
          echo "Before restart:"
          docker inspect money_bot --format='status={{.State.Status}} running={{.State.Running}} restart_count={{.RestartCount}}' || true

          docker restart money_bot

          echo "Waiting for container..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect money_bot --format='{{.State.Status}}' 2>/dev/null || true)
            HEALTH=$(docker inspect money_bot --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' 2>/dev/null || true)
            echo "status=$STATUS health=$HEALTH"
            if [ "$STATUS" = "running" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "no-healthcheck" ]; }; then
              break
            fi
            sleep 5
          done

          STATUS=$(docker inspect money_bot --format='{{.State.Status}}')
          HEALTH=$(docker inspect money_bot --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}')
          [ "$STATUS" = "running" ]
          if [ "$HEALTH" != "healthy" ] && [ "$HEALTH" != "no-healthcheck" ]; then
            echo "Container did not become healthy"
            docker logs money_bot --tail 100 || true
            exit 1
          fi

          echo "Checking Telegram API through container proxy..."
          timeout 20s docker exec money_bot python -c 'import os,httpx,sys
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          r=httpx.get("https://api.telegram.org/bot"+token+"/getMe",timeout=12,trust_env=True)
          ok=False
          try:
              ok=(r.json().get("ok") is True)
          except Exception:
              pass
          print("TELEGRAM_HTTP",r.status_code,"ok=",ok)
          sys.exit(0 if r.status_code==200 and ok else 2)'

          echo "Recent logs:"
          docker logs money_bot --tail 50 || true
