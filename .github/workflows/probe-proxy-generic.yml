name: Inspect current host reboot

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  inspect:
    runs-on: self-hosted
    steps:
      - name: Inspect host and postgres timing
        shell: bash
        run: |
          set +e
          echo "=== HOST ==="
          uptime -s || true
          who -b || true
          last -x | head -8 || true
          echo
          echo "=== POSTGRES ==="
          docker inspect postgres_server --format='status={{.State.Status}} running={{.State.Running}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restart_policy={{.HostConfig.RestartPolicy.Name}}'
          echo
          echo "=== CURRENT BOOT KERNEL ==="
          uname -a || true
