name: Probe Telegram through proxy

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: Probe Telegram API through configured proxy
        shell: bash
        run: |
          timeout 20s docker exec money_bot python -c 'import os,httpx,time,sys
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          t=time.time()
          try:
              r=httpx.get("https://api.telegram.org/bot"+token+"/getMe",timeout=12,trust_env=True)
              ok=False
              try:
                  ok=(r.json().get("ok") is True)
              except Exception:
                  pass
              print("TELEGRAM_HTTP",r.status_code,"ok=",ok,"sec",round(time.time()-t,2))
              sys.exit(0 if r.status_code==200 and ok else 2)
          except Exception as e:
              print("TELEGRAM_FAIL",type(e).__name__,repr(e),"sec",round(time.time()-t,2))
              sys.exit(3)'
