name: Diagnose and restart money bot

on:
  push:
    branches:
      - probe-proxy-generic-20261005

jobs:
  diagnose_restart:
    runs-on: self-hosted
    steps:
      - name: Diagnose, restart, and verify money_bot
        shell: bash
        run: |
          set -e

          echo "=== PRE-RESTART STATE ==="
          docker inspect money_bot --format='status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restart_count={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' || true
          docker inspect money_bot --format='health={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' || true
          echo
          echo "=== PRE-RESTART HEALTH LOG ==="
          docker inspect money_bot --format='{{if .State.Health}}{{range .State.Health.Log}}{{println .Start "|" .ExitCode "|" .Output}}{{end}}{{end}}' 2>/dev/null | tail -20 || true
          echo
          echo "=== PRE-RESTART RESOURCE SNAPSHOT ==="
          docker stats money_bot --no-stream --format='cpu={{.CPUPerc}} mem={{.MemUsage}} mem_pct={{.MemPerc}} pids={{.PIDs}}' || true
          echo
          echo "=== PRE-RESTART BOT LOGS (last 500) ==="
          docker logs money_bot --tail 500 2>&1 || true
          echo
          echo "=== ERROR SUMMARY ==="
          docker logs money_bot --tail 2000 2>&1 | grep -E 'TimedOut|Pool timeout|NetworkError|ConnectError|ReadTimeout|Conflict|ERROR|CRITICAL|Traceback|Exception' | tail -120 || true

          echo
          echo "=== RESTART ==="
          docker restart money_bot

          for i in $(seq 1 24); do
            STATUS=$(docker inspect money_bot --format='{{.State.Status}}' 2>/dev/null || true)
            HEALTH=$(docker inspect money_bot --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' 2>/dev/null || true)
            echo "status=$STATUS health=$HEALTH"
            if [ "$STATUS" = "running" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "no-healthcheck" ]; }; then
              break
            fi
            sleep 5
          done

          STATUS=$(docker inspect money_bot --format='{{.State.Status}}')
          HEALTH=$(docker inspect money_bot --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}')
          [ "$STATUS" = "running" ]
          if [ "$HEALTH" != "healthy" ] && [ "$HEALTH" != "no-healthcheck" ]; then
            echo "Container did not become healthy"
            docker logs money_bot --tail 150 || true
            exit 1
          fi

          echo
          echo "=== TELEGRAM API THROUGH CURRENT PROXY ==="
          timeout 20s docker exec money_bot python -c 'import os,httpx,sys,time
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          t=time.time()
          try:
              r=httpx.get("https://api.telegram.org/bot"+token+"/getMe",timeout=12,trust_env=True)
              ok=False
              try:
                  ok=(r.json().get("ok") is True)
              except Exception:
                  pass
              print("TELEGRAM_HTTP",r.status_code,"ok=",ok,"sec=",round(time.time()-t,2))
              sys.exit(0 if r.status_code==200 and ok else 2)
          except Exception as e:
              print("TELEGRAM_FAIL",type(e).__name__,repr(e),"sec=",round(time.time()-t,2))
              sys.exit(3)'

          echo
          echo "=== DB CHECK ==="
          timeout 10s docker exec money_bot python -c 'import os,psycopg,sys
          try:
              c=psycopg.connect(host=os.environ["DB_HOST"],port=os.environ.get("DB_PORT","5432"),dbname=os.environ["DB_NAME"],user=os.environ["DB_USER"],password=os.environ["DB_PASSWORD"],connect_timeout=5)
              cur=c.cursor(); cur.execute("select 1"); print("DB",cur.fetchone()[0]); c.close()
          except Exception as e:
              print("DB_FAIL",type(e).__name__,repr(e)); sys.exit(4)'

          echo
          echo "=== POST-RESTART LOGS ==="
          sleep 3
          docker logs money_bot --since 2m --tail 150 2>&1 || true
