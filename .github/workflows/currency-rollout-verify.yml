name: Verify deployed currencies and historical data

on:
  push:
    branches: [codex/currency-rollout-20261020]
    paths: [.github/workflows/currency-rollout-verify.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      EXPECTED_COMMIT: 9721c132ce278fa5f58bcc9960c3ff732c6b3e8f
    steps:
      - name: Verify exact deployed version and preserved data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BACKUP_DIR=$(cat /opt/money_bot/currency_rollout_backup)
          test -f "$BACKUP_DIR/database-preflight.json"
          sha256sum --check "$BACKUP_DIR/database.sha256"
          VERIFY_DIR="/opt/money_bot/verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$VERIFY_DIR"
          docker inspect money_bot > "$VERIFY_DIR/container.json"
          python3 - "$VERIFY_DIR/container.json" "$EXPECTED_COMMIT" "$BACKUP_DIR/runtime-inspect.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              current = json.load(stream)[0]
          with open(sys.argv[3], encoding="utf-8") as stream:
              original = json.load(stream)[0]
          if not re.fullmatch(r"[0-9a-f]{40}", sys.argv[2]):
              raise SystemExit("Expected commit is not pinned")
          image = current["Config"]["Image"]
          suffix = image.rsplit("-", 1)[-1]
          if not re.fullmatch(r"[0-9a-f]{7,40}", suffix) or not sys.argv[2].startswith(suffix):
              raise SystemExit("Production image does not match the deployed master commit")
          if current["State"]["Status"] != "running" or current["State"].get("Health", {}).get("Status") != "healthy":
              raise SystemExit("Production container is not healthy")
          if current["RestartCount"] != 0:
              raise SystemExit("Production container restarted after cutover")
          old_env = dict(value.split("=", 1) for value in original["Config"]["Env"])
          new_env = dict(value.split("=", 1) for value in current["Config"]["Env"])
          for key in ("TELEGRAM_BOT_TOKEN", "DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD", "HTTPS_PROXY"):
              if old_env.get(key) != new_env.get(key):
                  raise SystemExit("Working configuration changed: " + key)
          old_mounts = {(item["Source"], item["Destination"]) for item in original["Mounts"]}
          new_mounts = {(item["Source"], item["Destination"]) for item in current["Mounts"]}
          if not old_mounts.issubset(new_mounts):
              raise SystemExit("An original persistent mount is missing")
          print("DEPLOYED_IMAGE", image, "healthy=true restarts=0 configuration_preserved=true")
          PY
          VERIFY_CODE=$(cat <<'PY'
          import json
          import os
          import sys
          from datetime import date

          import httpx
          import psycopg

          from utils.currencies import CURRENCIES
          from utils.currency_rates import parse_cbr_xml

          baseline = json.load(sys.stdin)
          if len(CURRENCIES) != 12 or not {"JPY", "KRW", "USD", "RUB"}.issubset(CURRENCIES):
              raise SystemExit("Currency feature is missing from the deployed code")
          with psycopg.connect(
              host=os.environ["DB_HOST"], port=os.environ.get("DB_PORT", "5432"),
              dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"], connect_timeout=10,
          ) as connection:
              connection.execute("SET TRANSACTION READ ONLY")
              connection.execute("SET LOCAL statement_timeout = '30s'")
              if connection.execute("SELECT version_num FROM alembic_version").fetchall() != [("0003_currencies",)]:
                  raise SystemExit("Unexpected production schema revision")
              for table in ("expenses", "incomes"):
                  expected = baseline[table]
                  actual = connection.execute(
                      "SELECT count(*),COALESCE(sum(amount),0)::text,"
                      "md5(COALESCE(string_agg(id::text || ':' || COALESCE(amount::text,'NULL'),',' ORDER BY id),'')) "
                      "FROM " + table + " WHERE id <= %s", (expected["max_id"],)
                  ).fetchone()
                  if actual != (expected["count"], expected["amount_sum"], expected["amount_digest"]):
                      raise SystemExit("Historical monetary data changed: " + table)
                  typed_legacy = connection.execute(
                      "SELECT count(*) FROM " + table + " WHERE id <= %s AND "
                      "num_nonnulls(currency,reporting_amount,reporting_currency,fx_rate,fx_date,fx_source) <> 0",
                      (expected["max_id"],),
                  ).fetchone()[0]
                  if typed_legacy:
                      raise SystemExit("Historical rows were unexpectedly assigned currency: " + table)
                  print("HISTORICAL_DATA_PRESERVED", table)
              for table in ("currency_preferences", "currency_fallback_rates", "currency_daily_rates", "reporting_expenses", "reporting_incomes"):
                  connection.execute("SELECT * FROM " + table + " LIMIT 0")
              expected_constraints = {
                  "expenses_currency_snapshot_complete", "expenses_currency_code", "expenses_reporting_currency_code",
                  "incomes_currency_snapshot_complete", "incomes_currency_code", "incomes_reporting_currency_code",
                  "users_reporting_currency_code", "projects_reporting_currency_code", "currency_preferences_currency_code",
                  "currency_fallback_rates_source_currency_code", "currency_fallback_rates_target_currency_code",
                  "recurring_rules_currency_code", "recurring_incomes_currency_code", "budgets_currency_code",
                  "project_member_settings_threshold_currency_code", "cashback_monthly_snapshots_currency_code",
              }
              constraints = dict(connection.execute(
                  "SELECT conname,convalidated FROM pg_constraint WHERE connamespace='public'::regnamespace AND conname=ANY(%s)",
                  (list(expected_constraints),),
              ).fetchall())
              if set(constraints) != expected_constraints or not all(constraints.values()):
                  raise SystemExit("Currency constraints are missing or not validated")
              for table in ("recurring_rules", "recurring_incomes"):
                  rules = connection.execute(
                      "SELECT confdeltype::text FROM pg_constraint WHERE conrelid=to_regclass(%s) "
                      "AND confrelid='public.projects'::regclass AND contype='f'", (table,),
                  ).fetchall()
                  if not rules or any(row[0] != "c" for row in rules):
                      raise SystemExit("Recurring project relation is not cascading: " + table)
              for table in ("project_member_settings", "cashback_monthly_snapshots"):
                  sequence = connection.execute("SELECT pg_get_serial_sequence(%s,'id')", (table,)).fetchone()[0]
                  if sequence and not connection.execute("SELECT has_sequence_privilege(current_user,%s,'USAGE')", (sequence,)).fetchone()[0]:
                      raise SystemExit("Sequence access is missing: " + table)
          print("CURRENCY_SCHEMA_OK revision=0003_currencies supported=12 constraints=16 legacy_data_preserved=true")
          try:
              response = httpx.get("https://www.cbr.ru/scripts/XML_daily.asp", params={"date_req": date.today().strftime("%d/%m/%Y")}, timeout=8)
              response.raise_for_status()
              effective_date, rates = parse_cbr_xml(response.content, date.today())
              if not {"USD", "JPY", "KRW"}.issubset(rates):
                  raise ValueError("Required currency quotes are missing")
              print("CBR_RATE_SOURCE_OK", effective_date.isoformat(), "USD/JPY/KRW=true")
          except Exception as error:
              print("CBR_RATE_SOURCE_UNAVAILABLE", type(error).__name__, "manual_rates_supported=true")
              try:
                  direct = httpx.get("https://www.cbr.ru/scripts/XML_daily.asp", params={"date_req": date.today().strftime("%d/%m/%Y")}, timeout=8, trust_env=False)
                  direct.raise_for_status()
                  direct_date, direct_rates = parse_cbr_xml(direct.content, date.today())
                  if not {"USD", "JPY", "KRW"}.issubset(direct_rates):
                      raise ValueError("Required direct quotes are missing")
                  print("CBR_DIRECT_RATE_SOURCE_OK", direct_date.isoformat(), "USD/JPY/KRW=true")
                  print("CURRENT_NO_PROXY_EMPTY", not bool(os.environ.get("NO_PROXY") or os.environ.get("no_proxy")))
                  os.environ["NO_PROXY"] = os.environ.get("NO_PROXY") or "cbr.ru,www.cbr.ru"
                  bypass = httpx.get("https://www.cbr.ru/scripts/XML_daily.asp", params={"date_req": date.today().strftime("%d/%m/%Y")}, timeout=8)
                  bypass.raise_for_status()
                  bypass_date, bypass_rates = parse_cbr_xml(bypass.content, date.today())
                  if not {"USD", "JPY", "KRW"}.issubset(bypass_rates):
                      raise ValueError("Required bypass quotes are missing")
                  print("CBR_NO_PROXY_DEFAULT_OK", bypass_date.isoformat(), "USD/JPY/KRW=true")
              except Exception as direct_error:
                  print("CBR_DIRECT_RATE_SOURCE_UNAVAILABLE", type(direct_error).__name__)
          PY
          )
          docker exec -i money_bot python -c "$VERIFY_CODE" < "$BACKUP_DIR/database-preflight.json"
          docker inspect money_bot --format='final_status={{.State.Status}} final_health={{.State.Health.Status}} final_restarts={{.RestartCount}}'
      - name: Verify rendered CBR proxy exclusion
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROUTING_DIR="/opt/money_bot/cbr-config-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$ROUTING_DIR"
          export ROUTING_DIR
          docker inspect money_bot > "$ROUTING_DIR/container.json"
          cp /opt/money_bot/deploy-39444413212-1/runtime.env "$ROUTING_DIR/.env"
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ["ROUTING_DIR"], "compose.yml").write_text("services:\n  # Одноразовый сервис применения миграций БД (feature_113).\n  # Использует ТОТ ЖЕ образ, что и бот. Запускается явно в деплое ДО старта бота\n  # (см. .github/workflows/deploy.yml) и локально: `docker compose run --rm migrations`.\n  # profile \"tools\" — чтобы обычный `docker compose up` его не поднимал;\n  # порядком \"миграции → бот\" управляет деплой (Postgres внешний, поэтому\n  # depends_on на него недоступен — готовность ждём внутри scripts/run_migrations.sh).\n  migrations:\n    image: ghcr.io/watermellon2018/money_bot:${BOT_TAG}\n    command: [\"sh\", \"scripts/run_migrations.sh\"]\n    restart: \"no\"\n    env_file:\n      - .env\n    environment:\n      # Сколько секунд ждать готовности внешнего PostgreSQL перед миграциями\n      DB_WAIT_TIMEOUT: \"90\"\n    networks:\n      - postgres_net\n    profiles:\n      - tools\n\n  money_bot:\n    image: ghcr.io/watermellon2018/money_bot:${BOT_TAG}\n    container_name: money_bot\n    restart: always\n    env_file:\n      - .env\n    environment:\n      # CBR is reachable directly; Telegram continues to use HTTPS_PROXY.\n      NO_PROXY: ${NO_PROXY:-cbr.ru,www.cbr.ru}\n    volumes:\n      - /home/matafix/analitycs_money/telegram_bot_data/users:/app/data/users\n    ports:\n      - \"8010:8000\"  # Prometheus metrics endpoint: http://<server-ip>:8010/metrics\n    networks:\n      - postgres_net\n    healthcheck:\n      test: [\"CMD\", \"python\", \"-c\", \"import sys; sys.exit(0)\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n    labels:\n      logging: \"promtail\"\n\nnetworks:\n  postgres_net:\n    external: true\n")
          PY
          CURRENT_IMAGE=$(docker inspect money_bot --format='{{.Config.Image}}')
          export BOT_TAG="${CURRENT_IMAGE##*:}"
          export COMPOSE_PROJECT_NAME=$(docker inspect money_bot --format='{{index .Config.Labels "com.docker.compose.project"}}')
          docker compose -f "$ROUTING_DIR/compose.yml" --profile tools config --format json > "$ROUTING_DIR/rendered.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          routing = Path(os.environ["ROUTING_DIR"])
          current = json.loads((routing / "container.json").read_text())[0]
          expected = dict(item.split("=", 1) for item in current["Config"]["Env"])
          environment = json.loads((routing / "rendered.json").read_text())["services"]["money_bot"]["environment"]
          exclusions = {item.strip() for item in environment.get("NO_PROXY", "").split(",")}
          if not {"cbr.ru", "www.cbr.ru"}.issubset(exclusions):
              raise SystemExit("Rendered Compose configuration does not bypass CBR")
          for key in ("TELEGRAM_BOT_TOKEN", "DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD", "HTTPS_PROXY"):
              if environment.get(key) != expected.get(key):
                  raise SystemExit("Rendered Compose configuration changed a working setting: " + key)
          print("COMPOSE_NO_PROXY_OK", environment["NO_PROXY"], "telegram_proxy_preserved=true")
          PY
          rm -f -- "$ROUTING_DIR/.env" "$ROUTING_DIR/container.json" "$ROUTING_DIR/rendered.json" "$ROUTING_DIR/compose.yml"
          rmdir "$ROUTING_DIR"

